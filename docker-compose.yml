version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketing-postgres
    environment:
      POSTGRES_DB: marketing_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: marketing-ml
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/app
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  spring-app:
    build: ./spring-app
    container_name: marketing-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketing_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
      - ml-service
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: marketing-frontend
    ports:
      - "3000:3000"
    depends_on:
      - spring-app

volumes:
  postgres_data:
