# Spring Boot Docker Profile Configuration
# Use with: SPRING_PROFILES_ACTIVE=docker

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saas_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# JWT Configuration
jwt.secret=${JWT_SECRET:MarketingAISecretKey1234567890123456789012345678901234567890}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.example.socialpurchase=DEBUG
