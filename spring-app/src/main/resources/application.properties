# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/marketing_ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ML Service URL
ml.service.url=http://localhost:8000

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Jackson Date Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# JWT Configuration
jwt.secret=MarketingAISecretKey1234567890123456789012345678901234567890
jwt.expirationMs=86400000

# Logging
logging.level.com.example.socialpurchase=INFO
